spring:
  application:
    name: groupbuy-api
  datasource:
    url: jdbc:postgresql://localhost:5432/groupbuy
    username: groupbuy
    password: groupbuy
    hikari:
      maximum-pool-size: 20      # LT-01 에서 가장 먼저 고갈될 자원. 의도적으로 낮게 시작
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate         # 스키마는 Flyway 만 변경한다
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

groupbuy:
  participation:
    reservation-ttl: 10m       # 선점 후 결제 제한시간 (설계서 2.5)
  payment:
    provider: TOSS
    toss:
      base-url: https://api.tosspayments.com
      # 토스 테스트 시크릿 키. 운영 키는 환경변수/Secret 으로 주입한다
      secret-key: ${TOSS_SECRET_KEY:test_sk_docs_and_sandbox_only}
      # 비어 있으면 웹훅 서명 검증을 건너뛴다 (로컬 전용)
      webhook-secret: ${TOSS_WEBHOOK_SECRET:}
      connect-timeout: 3s
      read-timeout: 15s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.groupbuy: INFO
    org.hibernate.SQL: DEBUG   # 로컬 전용. 부하테스트 시 INFO 로

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:postgresql:16:///groupbuy   # Testcontainers JDBC URL
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
logging:
  level:
    org.hibernate.SQL: INFO
