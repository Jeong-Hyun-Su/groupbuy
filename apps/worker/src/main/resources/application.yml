spring:
  application:
    name: groupbuy-worker
  datasource:
    url: jdbc:postgresql://localhost:5432/groupbuy
    username: groupbuy
    password: groupbuy
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: false               # 마이그레이션은 api 만 실행한다
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

groupbuy:
  scheduler:
    open-interval-ms: 10000
    close-interval-ms: 5000
    reservation-expiry-interval-ms: 10000
  participation:
    reservation-ttl: 10m
  payment:
    provider: TOSS
    toss:
      base-url: https://api.tosspayments.com
      secret-key: ${TOSS_SECRET_KEY:test_sk_docs_and_sandbox_only}
      connect-timeout: 3s
      read-timeout: 15s

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:postgresql:16:///groupbuy   # Testcontainers JDBC URL
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: true                            # 테스트에서는 worker 도 스키마를 만든다
    locations: classpath:db/migration
