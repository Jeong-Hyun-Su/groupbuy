name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers 는 ubuntu-latest 의 Docker 를 그대로 쓴다
      - name: Build & test
        run: ./gradlew build --no-daemon

      - name: Architecture rules
        run: ./gradlew :arch-test:test --no-daemon

      # skip 은 통과가 아니다 (CLAUDE.md, G1). 하나라도 있으면 실패
      - name: No skipped tests
        run: .github/scripts/check-skipped.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'

  # 커밋에 들어간 토큰·키 검사. 새 의존성(gitleaks-action) — 이유·대안은 workflow-drafts/README.md
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Phase 5: 이미지 빌드 → GHCR push → k8s rollout
