name: jira-sync

# PR 상태를 Jira 에 옮긴다. 사람이 연 PR 도 같은 흐름을 탄다.
#   열림 → 검토 중,  머지 → 완료 (하위 작업이면 형제가 전부 끝났을 때 부모도 완료)
# Jira Automation 실행 한도를 쓰지 않으려고 Actions 에서 한다.
# jira-executor 도 PR 을 만든 뒤 검토 중으로 옮긴다 — Claude 앱이 연 PR 에 이 워크플로가
# 안 돌 수도 있어서 일부러 겹쳐 두었다. 이미 그 상태면 jira.sh 가 아무것도 안 한다.

on:
  pull_request:
    types: [opened, reopened, closed]

permissions:
  contents: read

concurrency:
  group: jira-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  JIRA_BASE_URL: https://ikerhold1572.atlassian.net
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 포크 PR 에는 시크릿이 없다. 이 저장소 브랜치의 PR 만 본다
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # 스크립트는 PR 브랜치가 아니라 main 에서 받는다. PR 브랜치(Claude 가 만든 것 포함)가
      # .github/scripts 를 바꿔도 Jira 토큰을 든 채 실행되지 않게
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      # 브랜치 접두((feature|fix|chore)/SCRUM-N) 또는 제목 접두("SCRUM-N:")에서만 찾는다.
      # 제목 중간에 다른 티켓 키를 적은 PR 이 그 티켓을 옮기지 않게 (2026-09-28 PR #14 가 완료된 SCRUM-38 을 검토 중으로 되돌림)
      - name: 이슈 키 찾기
        id: key
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          key=$(printf '%s\n' "$HEAD" | grep -oE '^(feature|fix|chore)/SCRUM-[0-9]+' | grep -oE 'SCRUM-[0-9]+' || true)
          [ -n "$key" ] || key=$(printf '%s\n' "$TITLE" | grep -oE '^SCRUM-[0-9]+:' | tr -d : || true)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          [ -n "$key" ] || echo "이슈 키가 없는 PR 이다. 건너뛴다."

      - name: Jira 전이
        if: steps.key.outputs.key != ''
        env:
          KEY: ${{ steps.key.outputs.key }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$ACTION" = "closed" ] && [ "$MERGED" != "true" ]; then
            # 다른 PR 로 이미 완료됐거나 사람이 옮긴 티켓은 건드리지 않는다
            [ "$(.github/scripts/jira.sh status "$KEY")" = "검토 중" ] || exit 0
            printf 'h3. PR 이 머지 없이 닫혔다\n%s\n\n다시 할지 정해 승인 대기 또는 완료(하지 않음)로 옮긴다. 자동 구현을 다시 돌리려면 브랜치 feature/%s 를 지운다.\n' "$PR_URL" "$KEY" > /tmp/closed.txt
            .github/scripts/jira.sh comment "$KEY" /tmp/closed.txt
            .github/scripts/jira.sh transition "$KEY" "질문"
            exit 0
          fi

          if [ "$MERGED" != "true" ]; then
            # 이미 완료된 티켓은 되돌리지 않는다
            [ "$(.github/scripts/jira.sh status "$KEY")" != "완료" ] || exit 0
            .github/scripts/jira.sh transition "$KEY" "검토 중"
            exit 0
          fi

          .github/scripts/jira.sh transition "$KEY" "완료"

          parent=$(.github/scripts/jira.sh get "$KEY" issuetype,parent |
            jq -r 'if .fields.issuetype.subtask then .fields.parent.key else empty end')
          [ -n "$parent" ] || exit 0
          left=$(.github/scripts/jira.sh get "$parent" subtasks |
            jq '[.fields.subtasks[] | select(.fields.status.statusCategory.key != "done")] | length')
          if [ "$left" -eq 0 ]; then
            .github/scripts/jira.sh transition "$parent" "완료"
          fi
