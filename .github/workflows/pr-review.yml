name: pr-review

# PR 자동 리뷰. 별도 세션이라 작업 컨텍스트 없이 결과물만 본다 — 그래서 의외로 잡아낸다.
# 리뷰 항목은 "이 프로젝트에서 실제로 터졌던 것"만 넣는다. 일반론은 넣지 않는다.

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.sql'
      - '**.yml'
      - '!docs/**'
      - '!**.md'

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 15 --model sonnet"
          prompt: |
            PR #${{ github.event.pull_request.number }} 의 변경분을 리뷰한다.
            `gh pr diff ${{ github.event.pull_request.number }}` 로 변경분을 읽는다.

            이 프로젝트는 공동구매 플랫폼이고 돈을 다룬다. CLAUDE.md 와 docs/design 의
            설계서를 기준으로 본다. 아래는 이 저장소에서 실제로 터졌던 결함 유형이다.
            같은 유형이 또 있는지 우선 본다.

            1. 외부 시스템(PG)에 부작용이 생긴 뒤 예외로 트랜잭션을 롤백하는 코드.
               승인·취소가 나간 뒤 롤백하면 기록이 사라져 보상할 근거가 없어진다.
            2. 상태를 점유(CLOSING 등)해 놓고 후속 처리가 실패했을 때, 그 상태를
               다시 집어가는 경로가 없는 코드. 조회 쿼리가 점유 상태를 포함하는지 본다.
            3. 외부 API 의 동작을 문서 확인 없이 가정한 코드. 특히 웹훅의 도착 시점,
               서명 제공 여부, 멱등성.
            4. 실패를 두 갈래(확정 실패 / 결과 불확실)로 나누지 않고 하나로 뭉갠 코드.
               불확실한 건을 FAILED 로 못 박으면 받은 돈을 잃는다.
            5. 같은 클래스 안에서 @Transactional 메서드를 호출하는 코드.
               Spring 프록시를 타지 않아 트랜잭션이 열리지 않는다.
            6. 비즈니스 불변식(R1~R8)을 깨뜨릴 수 있는 변경인데 테스트가 없는 경우.

            리뷰 규칙:
            - 확신이 있는 것만 쓴다. 추측성 지적은 쓰지 않는다.
            - 지적마다 파일:줄 과 "이 입력이면 이렇게 깨진다" 는 구체적 시나리오를 붙인다.
            - 스타일·취향 지적은 하지 않는다. 동작이 틀린 것만 본다.
            - 문제가 없으면 없다고 한 줄로 쓴다. 억지로 찾아내지 않는다.
            - gh pr comment 로 한 번만 코멘트한다. 승인/거절 리뷰는 남기지 않는다.
