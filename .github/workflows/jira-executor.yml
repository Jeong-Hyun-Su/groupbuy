name: jira-executor

# Jira 이슈가 '승인' 으로 전이되면 Jira Automation(A2) 이 repository_dispatch 를 쏜다.
# '승인' 은 '승인 대기' 에서만 갈 수 있다 — 트리아지(jira-triage)를 건너뛰는 길은 없다.
# 라벨 manual 티켓은 A2 가 쏘지 않고, 여기서도 한 번 더 막는다.
#
# 라벨 split-proposed 면 구현하지 않고, 트리아지가 첨부한 분해안으로 하위 작업만 만든다 (게이트 2 분해 승인).
# 상태 전이: 진행 중(시작) → 검토 중(Draft PR) / 질문(불명확·실패). 완료는 jira-sync 가 한다.
# PR 은 항상 Draft 로 연다. 사람이 읽고 설명할 수 있을 때 Ready 로 바꾸고 머지한다 (게이트 4·5).
# main 직접 푸시는 브랜치 보호(PR 필수 + build 필수)가 막는다.

on:
  repository_dispatch:
    types: [jira-approved]

permissions:
  contents: write
  pull-requests: write
  id-token: write

# 같은 이슈의 동시 실행만 막는다. 순차 재시도는 아래 브랜치 검사가 막는다.
concurrency:
  group: jira-${{ github.event.client_payload.key }}
  cancel-in-progress: false

env:
  JIRA_BASE_URL: https://ikerhold1572.atlassian.net
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
  KEY: ${{ github.event.client_payload.key }}

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # repository_dispatch 는 멱등성이 없다. 판단은 프롬프트가 아니라 셸에서 한다
      - name: 가드
        id: guard
        run: |
          [[ "$KEY" =~ ^SCRUM-[0-9]+$ ]] || { echo "잘못된 키: $KEY" >&2; exit 1; }
          skip() { echo "$1"; printf '%s\n' "$1" > /tmp/skip.txt; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }

          # 사람이 만든 feature/SCRUM-N-요약, fix/SCRUM-N 도 잡는다. SCRUM-1 이 SCRUM-12 에 걸리지 않게 끝을 본다
          if git ls-remote --heads origin | grep -qE "refs/heads/(feature|fix)/$KEY(-|$)"; then
            skip "이미 $KEY 브랜치가 있다. 자동 구현하지 않는다."
          fi

          mkdir -p .jira
          .github/scripts/jira.sh get "$KEY" summary,description,issuetype,parent,labels,issuelinks > .jira/issue.json

          if jq -e '.fields.labels | index("manual")' .jira/issue.json >/dev/null; then
            skip "라벨 manual — 직접 구현하는 티켓이다."
          fi

          # 이미 쪼갠 부모를 다시 승인해도 부모 전체를 구현하지 않는다
          if jq -e '.fields.labels | index("split")' .jira/issue.json >/dev/null; then
            skip "이미 하위 작업으로 쪼갠 티켓이다. 하위 작업을 승인한다."
          fi

          # 게이트 2 분해 승인: 하위 작업만 만들고 끝낸다
          if jq -e '.fields.labels | index("split-proposed")' .jira/issue.json >/dev/null; then
            .github/scripts/jira.sh attachment "$KEY" triage.json .jira/triage.json
            .github/scripts/triage-apply.sh create "$KEY" .jira/triage.json
            echo "split=true" >> "$GITHUB_OUTPUT"
            skip "분해 승인 — 하위 작업을 만들었다. 하위 작업을 각각 승인한다."
          fi

          # 하위 작업은 main 에서 브랜치를 딴다. 선행 PR 이 머지되지 않았으면 시작하지 않는다
          blockers=$(jq -r '.fields.issuelinks[]
            | select(.type.name == "Blocks" and .inwardIssue != null)
            | select(.inwardIssue.fields.status.statusCategory.key != "done")
            | .inwardIssue.key' .jira/issue.json | paste -sd, -)
          if [ -n "$blockers" ]; then
            .github/scripts/jira.sh transition "$KEY" "승인 대기"
            skip "선행 작업이 끝나지 않았다: $blockers. 머지 후 다시 승인한다."
          fi

          # 하위 작업이면 부모 설명을 함께 준다
          parent=$(jq -r 'if .fields.issuetype.subtask then .fields.parent.key else empty end' .jira/issue.json)
          {
            jq -r '"# " + .key + " " + .fields.summary + "\n\n" + (.fields.description // "")' .jira/issue.json
            if [ -n "$parent" ]; then
              echo; echo "---"; echo "## 부모 작업"
              .github/scripts/jira.sh get "$parent" summary,description |
                jq -r '"# " + .key + " " + .fields.summary + "\n\n" + (.fields.description // "")'
            fi
          } > .jira/ticket.md

          .github/scripts/jira.sh transition "$KEY" "진행 중"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 건너뜀 기록
        if: steps.guard.outputs.skip == 'true' && steps.guard.outputs.split != 'true'
        run: .github/scripts/jira.sh comment "$KEY" /tmp/skip.txt || true

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.skip == 'false'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bash 는 기본으로 막혀 있다. 여기 적은 명령만 쓸 수 있다 (SCRUM-29).
          claude_args: >-
            --max-turns 30 --model sonnet
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(./gradlew:*),Bash(git:*),Bash(gh pr create:*)"

          prompt: |
            .jira/ticket.md 의 Jira 이슈 ${{ github.event.client_payload.key }} 를 구현한다.
            트리아지 코멘트의 인수 조건이 설명에 없으면 설명 기준으로 한다.

            규칙:
            1. CLAUDE.md, docs/plan.md(범위·완료 기준), docs/design 의 설계서를 기준으로 삼는다.
            2. feature/${{ github.event.client_payload.key }} 브랜치에서 작업한다.
            3. 테스트를 함께 작성하고 ./gradlew build 를 통과시킨 뒤 커밋한다. .jira/ 는 커밋하지 않는다.
            4. gh pr create --draft 로 Draft PR 을 연다. 제목은 "${{ github.event.client_payload.key }}: 요약".
               본문에 인수 조건(AC 번호)별로 어떤 테스트가 증명하는지, 무엇을 왜 그렇게 했는지,
               확신이 없는 부분이 어디인지 쓴다. 사람이 이 본문을 읽고 코드를 설명할 수 있어야 머지된다.
            5. 절대 머지하지 않는다. main 에 직접 푸시하지 않는다.
            6. .github/ 아래 파일은 수정하지 않는다.
               Bash 는 ./gradlew, git, gh pr create 만 쓸 수 있다. cd·ls·cat 은 거부되니 파일은 Read·Glob·Grep 으로 보고 Edit·Write 로 고친다.

            7. 요구사항이 불명확하거나, 설계서와 이슈 내용이 어긋나면 구현을 멈춘다.
               PR 을 만들지 말고 무엇이 불명확한지 .jira/question.md 에 쓰고 종료한다.
               애매한 채로 만든 PR 은 치우는 비용이 만드는 비용보다 크다.

      - name: Jira 에 결과 반영
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s .jira/question.md ]; then
            { echo "h3. Claude 자동 구현: 질문"; cat .jira/question.md
              echo; echo "답을 설명에 반영한 뒤 '승인 대기' 로 옮긴다. (브랜치 feature/$KEY 가 남아 있으면 지운다)"; } > /tmp/q.txt
            .github/scripts/jira.sh comment "$KEY" /tmp/q.txt
            .github/scripts/jira.sh transition "$KEY" "질문"
            exit 0
          fi
          pr=$(gh pr list --head "feature/$KEY" --state open --json url -q '.[0].url')
          if [ -z "$pr" ]; then
            echo "PR 도 질문도 없다" >&2
            exit 1
          fi
          # 프롬프트가 --draft 를 빠뜨려도 Draft 로 되돌린다. 사람 검토 게이트 4를 모델에 맡기지 않는다
          if [ "$(gh pr view "$pr" --json isDraft -q .isDraft)" != "true" ]; then
            gh pr ready "$pr" --undo
          fi
          printf 'h3. Claude 자동 구현: Draft PR\n%s\n\n읽고 설명할 수 있으면 Ready for review 로 바꾸고 머지한다.\n' "$pr" > /tmp/pr.txt
          .github/scripts/jira.sh comment "$KEY" /tmp/pr.txt
          .github/scripts/jira.sh transition "$KEY" "검토 중"

      # 실패하면 이슈가 진행 중에 방치된다. Jira 에 흔적을 남기고 '질문' 으로 돌린다
      - name: 실패 표시
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'h3. Claude 자동 구현 실패\n런: %s\n\n원인을 확인한다. 브랜치 feature/%s 가 남아 있으면 지워야 다시 승인할 수 있다.\n' "$RUN_URL" "$KEY" > /tmp/fail.txt
          .github/scripts/jira.sh comment "$KEY" /tmp/fail.txt || true
          .github/scripts/jira.sh transition "$KEY" "질문" || true

      - name: 결과 알림
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          if [ "${{ steps.guard.outputs.skip }}" = "true" ]; then
            TEXT="[skipped] $KEY — $(cat /tmp/skip.txt)"
          else
            TEXT="[${{ job.status }}] $KEY — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg t "$TEXT" '{text:$t}')" || true
