global:
  scrape_interval: 5s

scrape_configs:
  - job_name: groupbuy-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: groupbuy-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
