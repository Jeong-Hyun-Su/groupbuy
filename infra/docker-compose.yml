# 로컬 개발 인프라. 설계서 5.1.
#   기본:            docker compose up -d                      (postgres, redis)
#   Phase 3 이상:    docker compose --profile kafka up -d
#   Phase 5:         docker compose --profile kafka --profile search --profile observability up -d
name: groupbuy

services:
  postgres:
    image: postgres:16-alpine
    container_name: groupbuy-postgres
    environment:
      POSTGRES_DB: groupbuy
      POSTGRES_USER: groupbuy
      POSTGRES_PASSWORD: groupbuy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupbuy -d groupbuy"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: >
      postgres
        -c max_connections=200
        -c log_min_duration_statement=200
        -c shared_preload_libraries=pg_stat_statements

  redis:
    image: redis:7-alpine
    container_name: groupbuy-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Phase 3 ----
  kafka:
    image: apache/kafka:3.9.0
    container_name: groupbuy-kafka
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: groupbuy-local-cluster-0001
    volumes:
      - kafkadata:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: groupbuy-kafka-ui
    profiles: ["kafka"]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # ---- Phase 5 ----
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: groupbuy-es
    profiles: ["search"]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    # 한글 분석기: 컨테이너 기동 후 1회
    #   docker exec groupbuy-es bin/elasticsearch-plugin install analysis-nori
    volumes:
      - esdata:/usr/share/elasticsearch/data

  prometheus:
    image: prom/prometheus:latest
    container_name: groupbuy-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: groupbuy-grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  kafkadata:
  esdata:
  grafanadata:
